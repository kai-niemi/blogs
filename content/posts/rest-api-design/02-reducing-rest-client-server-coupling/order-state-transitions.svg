<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Order lifecycle and advertised affordances</title>
<desc id="desc">The placed order state offers cancel and pay transitions. Cancellation leads to cancelled; payment leads to payment pending, which can become paid or payment blocked. Paid can become delivered. The illustration highlights only the transitions currently advertised for a placed order.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#687d8c"/></marker><marker id="arrgreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#18856a"/></marker></defs>
<rect width="1100" height="520" rx="20" fill="#f7f9fc"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="42" y="48" font-size="25" font-weight="700" fill="#1b2b3a">Server-owned order lifecycle</text><text x="42" y="75" font-size="16" fill="#52677a">Highlighted arrows are the interactions advertised for the current order.</text></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle" fill="#193247">
<rect x="70" y="175" width="185" height="74" rx="12" fill="#e4f5ee" stroke="#18856a" stroke-width="3"/><text x="162" y="205" font-weight="700">placed</text><text x="162" y="229" font-size="14" fill="#277e65">current state</text>
<rect x="390" y="100" width="185" height="74" rx="12" fill="#edf1f5" stroke="#a5b3c0"/><text x="482" y="144">cancelled</text>
<rect x="390" y="265" width="205" height="74" rx="12" fill="#edf1f5" stroke="#a5b3c0"/><text x="492" y="308">payment_pending</text>
<rect x="730" y="175" width="155" height="74" rx="12" fill="#edf1f5" stroke="#a5b3c0"/><text x="807" y="218">paid</text>
<rect x="730" y="355" width="205" height="74" rx="12" fill="#edf1f5" stroke="#a5b3c0"/><text x="832" y="398">payment_blocked</text>
<rect x="935" y="175" width="145" height="74" rx="12" fill="#edf1f5" stroke="#a5b3c0"/><text x="1007" y="218">delivered</text>
</g>
<g fill="none" stroke-width="3" stroke-linecap="round"><path d="M255 190 L389 143" stroke="#18856a" marker-end="url(#arrgreen)"/><path d="M255 237 L389 293" stroke="#18856a" marker-end="url(#arrgreen)"/><path d="M595 286 L729 235" stroke="#687d8c" marker-end="url(#arr)"/><path d="M595 320 L729 384" stroke="#687d8c" marker-end="url(#arr)"/><path d="M885 212 L934 212" stroke="#687d8c" marker-end="url(#arr)"/></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700"><text x="308" y="144" fill="#18856a">cancel</text><text x="312" y="283" fill="#18856a">pay</text><text x="627" y="239" fill="#617382">success</text><text x="631" y="373" fill="#617382">failure</text><text x="894" y="193" fill="#617382">deliver</text></g>
<rect x="68" y="446" width="960" height="44" rx="9" fill="#e8f3ef"/><circle cx="94" cy="468" r="8" fill="#18856a"/><text x="116" y="474" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#255b4d">For a placed order, the representation currently advertises os:cancel and os:pay.</text>
</svg>
