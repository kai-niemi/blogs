<pre class="mermaid">
{{ .Inner | safeHTML }}
</pre>

{{ if not (.Page.Scratch.Get "mermaid-loaded") }}
{{ .Page.Scratch.Set "mermaid-loaded" true }}

<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
        startOnLoad: true,
        theme: 'neutral'
    });
</script>
{{ end }}
