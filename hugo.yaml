baseURL: "https://blog.cloudneutral.se/"
languageCode: "en-us"
title: "CloudNeutral"
theme: "PaperMod"

enableRobotsTXT: true

taxonomies:
  category: categories
  tag: tags
  series: series

outputFormats:
  ArticleStats:
    mediaType: text/plain
    baseName: article-stats
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - ArticleStats

permalinks:
  posts: "/:slug/"

params:
  series_weight: 3
  author: "Kai Niemi"
  description: "Articles on distributed systems, databases and software engineering"
  hideSummary: false
  ShowReadingTime: true
  ShowToc: true
  TocOpen: false
  ShowCodeCopyButtons: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  showPostContent: false
  images:
    - "images/cover.webp"

  homeInfoParams:
    Title: "CloudNeutral"
    Content: "Distributed Systems · Databases · Software Architecture"

  profileMode:
    enabled: false
    title: "CloudNeutral"
    subtitle: "Distributed Systems · Databases · Software Architecture"
    imageUrl: "/images/cover.webp"
    imageWidth: 600
    imageHeight: 300

markup:
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    noClasses: false
    style: "monokai"

menu:
  main:
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10

    - identifier: series
      name: Series
      url: /series/
      weight: 15

    - identifier: search
      name: Search
      url: /search/
      weight: 20

    - identifier: about
      name: About
      url: /about/
      weight: 30